<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>수학 오개념 진단 도우미</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
/* ===================== 디자인 토큰 (Clay 스타일: 크림 바탕 · 검정 버튼 · 채도 높은 색 카드) ===================== */
/* ===================== 디자인 토큰: 연한 바탕 + 흰 카드 대시보드 =====================
 * 학생(기본·로그인) = 웜톤, 교사(body.theme-teacher) = 쿨톤. 중요한 숫자·진행은 진한 녹색(--key).
 * 컨셉 색은 테마마다 3가지: 바탕 계열, 진한 녹색(--key), 강조색(--accent). */
:root{
  --bg:#f6f2eb;--surface:#fbf8f3;--box:#f3eee6;--box-strong:#e8e1d5;--paper:#ffffff;
  --ink:#2a2520;--body-strong:#2a2520;--body:#4a433c;--muted:#857c72;--muted-soft:#b0a79c;
  --hairline:#e8e1d5;--hairline-soft:#f1ece4;
  --primary:#1f4d3a;--primary-active:#173d2e;--primary-disabled:#e8e1d5;--on-primary:#ffffff;
  --key:#1f4d3a;--key-mid:#2f8a5c;--key-weak:#e4efe8;
  --accent:#c8682a;--accent-ink:#9a4a17;--accent-weak:#f8e9dc;
  --danger:#d23c3c;--danger-weak:#fbe7e5;
  --hl:#fbefc6;--hl-line:#e7c65a;
  --shadow:0 1px 2px rgba(42,37,32,.05);
  --chart-correct:#2f8a5c;--chart-wrong:#d0602e;
  --r-xs:4px;--r-sm:6px;--r-md:8px;--r-lg:12px;--r-xl:14px;--r-pill:9999px;
  --font:"Pretendard","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif;
}
body.theme-teacher{
  /* 교사: 실버 바탕 + 웜 오텀(적갈색) 강조 */
  --bg:#f6f2eb;--surface:#fbf8f3;--box:#eff1f4;--box-strong:#dfe3e8;
  --ink:#1f2328;--body-strong:#1f2328;--body:#3c434d;--muted:#727a85;--muted-soft:#a6adb6;
  --hairline:#dde1e6;--hairline-soft:#eceef1;
  --primary:#a94d26;--primary-active:#8f3f1e;--primary-disabled:#dfe3e8;
  --key:#a94d26;--key-mid:#cc7a4f;--key-weak:#f7e8df;
  --accent:#a94d26;--accent-ink:#8a3c1b;--accent-weak:#f7e8df;
  --shadow:0 1px 2px rgba(31,35,40,.06);
}
/* 예전 이름(다른 규칙·스크립트가 씀) → 새 토큰. body에서 계산해야 교사 테마 값이 반영된다. */
body{
  --canvas:var(--bg);--surface-soft:var(--surface);--surface-card:var(--box);--surface-strong:var(--box-strong);
  --card:var(--paper);--line:var(--hairline);--line2:var(--hairline);--text:var(--ink);--primary-weak:var(--key-weak);--radius:var(--r-lg);
  --ok:var(--key);--ok-weak:var(--key-weak);--warn:var(--accent);--warn-weak:var(--accent-weak);
  --lav-weak:var(--box);--lav-ink:var(--key);
  --brand-pink:var(--accent);--brand-teal:var(--key);--brand-lavender:var(--box-strong);--brand-peach:var(--accent-weak);
  --brand-ochre:var(--hl-line);--brand-mint:var(--key-weak);--brand-coral:var(--danger);
  min-height:100vh;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--body-strong);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
#app{min-height:100vh}

/* 글자 단계 */
.display-xl{font-size:44px;font-weight:700;line-height:1.2;letter-spacing:-1.2px;color:var(--ink);margin:0}
.display-md{font-size:30px;font-weight:700;line-height:1.3;letter-spacing:-0.6px;color:var(--ink);margin:0}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.2px;color:var(--muted)}
.lead{font-size:17px;line-height:1.6;color:var(--body)}
/* 카드 제목: 앞에 짧은 진한 녹색 막대 */
.card-title{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;color:var(--ink);margin:0 0 12px}
.card-title::before{content:"";width:3px;height:15px;border-radius:2px;background:var(--key);flex:none}

/* ===================== 로그인 ===================== */
.center-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-hero{min-height:100vh;max-width:1120px;margin:0 auto;padding:48px 24px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,460px);gap:56px;align-items:center}
.login-copy{display:flex;flex-direction:column;gap:18px}
.login-copy .lead{max-width:480px}
.login-steps{display:flex;flex-direction:column;gap:10px;margin-top:8px;max-width:440px}
.login-step{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--hairline);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--shadow)}
.step-no{width:32px;height:32px;border-radius:var(--r-md);background:var(--key);color:var(--on-primary);display:flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.step-t{font-weight:700;color:var(--ink)}
.card{background:var(--paper);border:1px solid var(--hairline);border-radius:var(--r-xl);padding:28px;box-shadow:var(--shadow)}
.login-card{width:100%;max-width:520px;padding:32px 32px 36px}
.app-title{font-size:22px;font-weight:700;letter-spacing:-0.4px;line-height:1.3;color:var(--ink);margin:0 0 4px}
.app-sub{color:var(--muted);font-size:14px;margin:0 0 22px}

/* ===================== 탭 · 입력 · 버튼 ===================== */
.tabs{display:flex;gap:6px;margin-bottom:24px;flex-wrap:wrap}
.tab{height:40px;padding:0 16px;border-radius:var(--r-pill);border:1px solid var(--hairline);background:var(--paper);color:var(--body);font-size:14px;font-weight:600}
.tab.active{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.row2{display:flex;gap:12px}.row2>.field{flex:1;min-width:0}
.field{margin-bottom:14px}
.field label{display:block;color:var(--muted);font-size:13px;font-weight:500;margin-bottom:6px}
.input,select.input{width:100%;height:48px;border:1px solid var(--hairline);border-radius:var(--r-md);background:var(--paper);padding:0 16px;font-size:16px;color:var(--ink);outline:none}
.input:focus{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
textarea.input{height:auto;min-height:90px;padding:12px 16px;line-height:1.55;resize:vertical}
.btn{height:44px;padding:0 18px;border-radius:var(--r-md);border:1px solid var(--hairline);background:var(--paper);color:var(--ink);font-weight:600;font-size:14px;line-height:1;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:disabled{background:var(--primary-disabled);border-color:var(--primary-disabled);color:var(--muted);cursor:not-allowed}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:active{background:var(--primary-active)}
.btn.primary:disabled{background:var(--primary-disabled);border-color:var(--primary-disabled);color:var(--muted)}
.btn.ok{background:var(--brand-teal);border-color:var(--brand-teal);color:var(--on-primary)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--key);text-decoration:underline}
.btn.danger{background:var(--paper);color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,var(--paper))}
.btn.sm{height:36px;padding:0 14px;font-size:13px;border-radius:var(--r-sm)}
.btn.block{width:100%;height:52px;font-size:16px}
.submit-btn{margin-top:10px}
.link-btn{background:none;border:none;color:var(--ink);text-decoration:underline;font-size:14px;font-weight:500;padding:8px}
.msg{min-height:22px;margin-top:12px;font-size:14px;color:var(--danger);text-align:center;white-space:pre-line}
.msg.ok{color:var(--ok)}

/* ===================== 위쪽 막대 · 페이지 ===================== */
.topbar{position:sticky;top:0;z-index:20;height:60px;background:var(--paper);border-bottom:1px solid var(--hairline);display:flex;align-items:center;gap:10px;padding:0 20px}
.topbar .title{flex:1;text-align:center;font-weight:700;font-size:18px;letter-spacing:-0.2px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:40px;height:40px;border-radius:var(--r-pill);border:1px solid var(--hairline);background:var(--paper);font-size:18px;display:inline-flex;align-items:center;justify-content:center}
.page{max-width:1120px;margin:0 auto;padding:24px 20px 96px}
.section-title{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:700;letter-spacing:-0.3px;line-height:1.3;color:var(--ink);margin:32px 2px 14px}
.section-title .count{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:24px;padding:0 8px;border-radius:var(--r-pill);background:var(--key);color:var(--on-primary);font-size:13px;font-weight:700;letter-spacing:0}
.muted{color:var(--muted)}.small{font-size:13px}
.list{display:flex;flex-direction:column;gap:10px}

/* 학생 첫 화면 머리 */
.home-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,360px);gap:20px;align-items:stretch;margin-top:12px}
.home-hero-copy{display:flex;flex-direction:column;justify-content:center;gap:10px;padding:8px 2px}
.progress-card{background:var(--key);color:var(--on-primary);border-radius:var(--r-xl);padding:22px 26px;display:flex;flex-direction:column;gap:10px}
.progress-card .eyebrow{color:color-mix(in srgb,var(--on-primary) 72%,transparent)}
.progress-num{font-size:44px;font-weight:700;letter-spacing:-1px;line-height:1}
.progress-num small{font-size:20px;font-weight:600;letter-spacing:0;opacity:.7;margin-left:4px}
.progress-bar{height:8px;border-radius:var(--r-pill);background:color-mix(in srgb,var(--on-primary) 20%,transparent);overflow:hidden}
.progress-bar>div{height:100%;border-radius:var(--r-pill);background:var(--on-primary)}
.progress-msg{font-size:14px;line-height:1.5;color:color-mix(in srgb,var(--on-primary) 88%,transparent)}
/* 리포트 버튼: 다 마치기 전 회색, 다 마치면 빨간색 */
.btn.report-btn:disabled{background:var(--box-strong);border-color:var(--box-strong);color:var(--muted);opacity:1}
.btn.report-btn.ready{background:var(--key);border-color:var(--key);color:var(--on-primary);font-weight:700}

/* 문제 목록: 번호 + 개념명 */
.item-card{background:var(--paper);border:1px solid var(--hairline);border-radius:var(--r-lg);padding:14px 18px;display:flex;align-items:center;gap:14px;cursor:pointer;box-shadow:var(--shadow)}
.item-card:hover{border-color:var(--key)}
.item-no{width:40px;height:40px;border-radius:var(--r-md);background:var(--box);color:var(--ink);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;flex:none}
.item-card.doing{border-color:color-mix(in srgb,var(--key) 45%,var(--hairline))}
.item-card.doing .item-no{background:var(--key);color:var(--on-primary)}
.item-card.done{background:var(--box);border-color:var(--box);box-shadow:none}
.item-card.done .item-no{background:var(--box-strong);color:var(--muted)}
.item-card.done .item-title{color:var(--muted);font-weight:500}
.item-body{flex:1;min-width:0}
.item-title{font-weight:600;font-size:16px;color:var(--ink)}
.item-prev{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-badges{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
/* 풀이 완료 접어 두기 */
.fold{margin-top:24px}
.fold-head{width:100%;display:flex;align-items:center;gap:10px;background:transparent;border:none;border-top:1px solid var(--hairline);padding:16px 2px 12px;font-size:16px;font-weight:700;color:var(--muted);text-align:left}
.fold-head .count{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:24px;padding:0 8px;border-radius:var(--r-pill);background:var(--box-strong);color:var(--muted);font-size:13px;margin-left:4px}
.fold-head .fold-label{margin-left:auto;font-size:13px;font-weight:600}
.fold-arrow{transition:transform .15s;font-size:14px}
.fold-head:not(.open) .fold-arrow{transform:rotate(-90deg)}

/* 배지 */
.badge{display:inline-block;padding:4px 10px;border-radius:var(--r-pill);font-size:12.5px;font-weight:600;background:var(--box);color:var(--body);white-space:nowrap}
.badge.blue{background:var(--box);color:var(--body)}
.badge.green{background:var(--key-weak);color:var(--key)}
.badge.orange{background:var(--accent-weak);color:var(--accent-ink)}
.badge.red{background:var(--danger-weak);color:var(--danger)}
.badge.doing{background:var(--key-weak);color:var(--key)}
.badge.done{background:var(--box-strong);color:var(--body)}
.badge.note{background:var(--accent-weak);color:var(--accent-ink)}

/* ===================== 문제 · 풀이 ===================== */
.problem-card{background:var(--paper);border:1px solid var(--hairline);border-radius:var(--r-lg);padding:22px;box-shadow:var(--shadow)}
.problem-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.problem-text{font-size:18px;line-height:1.75;word-break:keep-all;color:var(--ink)}
/* 문제 이미지: 흰 배경 위에 폭에 맞춰 보여 준다 */
.problem-img-wrap{margin-top:4px;background:var(--paper);border-radius:var(--r-sm);overflow:hidden}
.problem-img{display:block;max-width:100%;height:auto;margin:0 auto}
.tutor-problem .problem-img{max-height:320px;width:auto}
.answer-edit{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.problem-img-wrap{cursor:zoom-in;position:relative}
.zoom-hint{text-align:right;font-size:12px;color:var(--muted);margin-top:4px}
.problem-zoom{overflow:auto;-webkit-overflow-scrolling:touch;max-height:75dvh}
.problem-zoom img{display:block;max-width:none;width:auto}
@media (min-width:641px){.zoom-hint{display:none}}
.figure-box{margin-top:12px;display:flex;justify-content:center}
.figure-box svg{max-width:100%;height:auto;background:var(--paper);border:1px solid var(--hairline);border-radius:var(--r-md)}
.understand{margin:14px 0;background:var(--paper);border:1px solid var(--hairline);border-radius:var(--r-lg);padding:14px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.understand .q{flex:1;font-weight:600;color:var(--ink);min-width:200px}
.yn{height:44px;min-width:84px;border-radius:var(--r-pill);border:1px solid var(--hairline);background:var(--paper);color:var(--ink);font-weight:600;font-size:14px}
.yn.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.help-btn{padding:0 20px;white-space:nowrap;flex:none;border-radius:var(--r-md);background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.work{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:640px){.work{grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:8px}.problem-text{font-size:16px}.panel{padding:12px}}
.panel{background:var(--paper);border:1px solid var(--hairline);border-radius:var(--r-lg);padding:20px;min-height:260px;box-shadow:var(--shadow)}
.panel-title{font-weight:700;font-size:16px;color:var(--ink);margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.drop{border:1.5px dashed var(--box-strong);background:var(--surface-soft);border-radius:var(--r-lg);padding:22px 12px;text-align:center;color:var(--muted)}
.drop .big{font-size:34px}
.photo-btns{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.photo-prev{width:100%;border-radius:var(--r-md);border:1px solid var(--hairline);display:block;cursor:zoom-in}
.symbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.sym{min-width:38px;height:36px;padding:0 9px;border-radius:var(--r-sm);border:none;background:var(--surface-card);color:var(--ink);font-size:15px;font-weight:600}
.sym:active{background:var(--surface-strong)}
.line-row{border:1px solid var(--hairline);border-radius:var(--r-md);padding:8px;margin-bottom:8px;background:var(--paper)}
.line-row.uncertain{background:var(--hl);border-color:var(--hl-line)}
.line-top{display:flex;gap:6px;align-items:center}
.line-no{width:22px;color:var(--muted);font-size:13px;text-align:center;flex:none}
.line-input{flex:1;min-width:0;height:42px;border:1px solid var(--hairline);border-radius:var(--r-sm);padding:0 10px;font-size:16px;background:var(--paper);outline:none}
.line-input:focus{border-color:var(--ink)}
.line-del{width:34px;height:34px;border-radius:var(--r-sm);border:1px solid var(--hairline);background:var(--paper);color:var(--muted);flex:none}
.line-prev{margin:6px 0 0 28px;min-height:20px;font-size:16px;overflow-x:auto}
.line-ask{margin:6px 0 0 28px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:#7a5600;font-weight:600}
/* 풀이 전체를 한 칸에서 고치는 입력칸 + 수식 미리보기 */
.sol-text{display:block;width:100%;box-sizing:border-box;min-height:calc(6 * 1.7em + 24px);border:1px solid var(--hairline);border-radius:var(--r-md);padding:12px 16px;font:inherit;font-size:16px;line-height:1.7;resize:vertical;outline:none;background:var(--paper);color:var(--ink)}
.sol-text:focus{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.sol-preview-title{margin:16px 0 6px;font-size:12px;font-weight:600;letter-spacing:1.2px;color:var(--muted)}
.sol-preview{border:1px solid var(--hairline);border-radius:var(--r-md);background:var(--surface-soft);padding:6px 14px;margin-bottom:14px}
.sol-line{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:8px 0;border-bottom:1px dashed var(--surface-strong)}
.sol-line:last-child{border-bottom:none}
.sol-line .line-no{flex:none;width:18px}
.sol-math{flex:1;min-width:0;font-size:18px;overflow-x:auto;overflow-y:hidden}
.sol-line.uncertain{background:var(--hl);margin:0 -14px;padding:8px 14px;border-bottom-color:var(--hl-line)}
.sol-line .line-ask{flex-basis:100%;margin:2px 0 0 28px}

/* 채점 결과: 채도 있는 색 카드 */
.result{margin-top:16px;border-radius:var(--r-xl);padding:22px 24px;border:1px solid var(--hairline);border-left:5px solid var(--muted-soft);background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
.result.correct{background:var(--key-weak);border-color:var(--key-weak);border-left-color:var(--key)}
.result.wrong{background:var(--accent-weak);border-color:var(--accent-weak);border-left-color:var(--accent)}
.result.hold{background:var(--box);border-color:var(--box);border-left-color:var(--muted)}
.result .big{font-size:20px;font-weight:700;letter-spacing:-0.3px;line-height:1.4;margin-bottom:6px}
.result .muted{color:color-mix(in srgb,var(--ink) 72%,transparent)}
.result .btn:not(.primary):not(.ok){background:var(--paper);border-color:var(--hairline)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.help-card{margin-top:14px;background:var(--paper);border:1px solid var(--hairline);border-radius:var(--r-lg);padding:20px;line-height:1.7}
.result .help-card{border:none}

/* 유도질문 채팅 */
.tutor{margin-top:16px;background:var(--paper);border:1px solid var(--hairline);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}
.tutor-head{padding:14px 20px;border-bottom:1px solid var(--hairline);background:var(--surface-soft)}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.crumb{font-size:12.5px;font-weight:500;padding:4px 12px;border-radius:var(--r-pill);background:var(--surface-card);color:var(--ink)}
.crumb.cur{background:var(--key);color:var(--on-primary)}
.tutor-problem{padding:14px 20px;border-bottom:1px solid var(--hairline);background:var(--paper)}
.chat{padding:16px;display:flex;flex-direction:column;gap:10px;max-height:460px;max-height:min(460px,60dvh);overflow-y:auto;background:var(--canvas)}
/* 대화가 길어져도 말풍선이 눌려 찌그러지지 않고 목록이 스크롤되게 */
.chat>*{flex-shrink:0}
.bubble{max-width:86%;padding:11px 15px;border-radius:14px;line-height:1.6;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.bubble.tutor{background:var(--paper);border:1px solid var(--hairline);align-self:flex-start;border-top-left-radius:6px;color:var(--ink)}
.bubble.student{background:var(--key);color:var(--on-primary);align-self:flex-end;border-top-right-radius:6px}
.bubble.system{align-self:center;background:var(--surface-card);color:var(--body);font-size:13px;border-radius:var(--r-pill);padding:6px 14px}
.chat-input{border-top:1px solid var(--hairline);padding:12px;background:var(--paper)}
.chat-row{display:flex;gap:8px;align-items:flex-end}
.chat-row textarea{flex:1;min-height:46px;max-height:140px;border:1px solid var(--hairline);border-radius:var(--r-md);padding:11px 14px;resize:none;outline:none;font-size:16px;background:var(--paper)}
.chat-row textarea:focus{border-color:var(--ink)}
.think{font-size:13px;color:var(--muted);margin:6px 2px}

/* ===================== 교사: 반별 폴더(색 카드) · 표 ===================== */
.folder-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.folder{background:var(--paper);color:var(--ink);border:1px solid var(--hairline);border-radius:var(--r-lg);padding:18px 20px 20px;cursor:pointer;box-shadow:var(--shadow)}
.folder:hover{border-color:var(--key)}
.folder-head{display:flex;align-items:center;justify-content:space-between}
.folder-head .card-title{margin:0;font-size:17px}
.folder .go{color:var(--muted-soft);font-size:18px}
.stat-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.mini-stat{background:var(--box);border-radius:var(--r-md);padding:12px 8px;text-align:center;display:flex;flex-direction:column;gap:2px}
.mini-stat b{font-size:24px;font-weight:700;letter-spacing:-0.5px;color:var(--ink);line-height:1.2}
.mini-stat b.key{color:var(--key)}
.mini-stat span{font-size:12.5px;color:var(--muted)}
/* 교사 설정: 두 칸(스크롤 없이) */
.settings-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px}
.settings-grid .field{margin-bottom:10px}
.settings-grid .section-title{display:none}
.settings-col+.settings-col{border-left:1px solid var(--hairline);padding-left:28px}
@media (max-width:760px){.settings-grid{grid-template-columns:1fr;gap:18px}.settings-col+.settings-col{border-left:none;padding-left:0;border-top:1px solid var(--hairline);padding-top:16px}}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--paper);border:1px solid var(--hairline);border-radius:var(--r-lg);overflow:hidden;font-size:14px;box-shadow:var(--shadow)}
.tbl th,.tbl td{padding:12px 10px;border-bottom:1px solid var(--hairline-soft);text-align:left;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl th{background:var(--surface-soft);color:var(--muted);font-weight:600;font-size:12.5px;border-bottom:1px solid var(--hairline)}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--surface-soft)}
.tbl-wrap{overflow-x:auto}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters .input{height:44px;width:auto;min-width:120px;font-size:15px}

/* ===================== 팝업 · 알림 · 로딩 ===================== */
.modal-back{position:fixed;inset:0;background:rgba(10,10,10,.42);z-index:100;display:flex;align-items:center;justify-content:center;padding:14px}
.modal{background:var(--paper);border-radius:var(--r-xl);max-width:560px;width:100%;max-height:92vh;max-height:92dvh;overflow:auto;overscroll-behavior:contain;padding:28px}
/* 팝업이 열려 있는 동안 뒤 화면이 스크롤되지 않게 */
body:has(.modal-back){overflow:hidden}
.modal.wide{max-width:980px}
.modal h3{margin:0 0 18px;font-size:20px;font-weight:700;letter-spacing:-0.3px;line-height:1.3;color:var(--ink)}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--on-primary);padding:12px 18px;border-radius:var(--r-md);font-size:14px;font-weight:500;max-width:90vw;white-space:pre-line}
.toast.err{background:var(--danger)}
.loading{position:fixed;inset:0;z-index:150;background:color-mix(in srgb,var(--canvas) 78%,transparent);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;font-weight:600;color:var(--ink);text-align:center;padding:20px}
.spinner{width:36px;height:36px;border:4px solid var(--surface-strong);border-top-color:var(--ink);border-radius:50%;animation:spin 1s linear infinite}
.spinner.sm{width:18px;height:18px;border-width:3px}
@keyframes spin{to{transform:rotate(360deg)}}
.inline-load{display:flex;align-items:center;gap:10px;color:var(--muted);padding:12px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:14px}
.kv .k{color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.pre-lines{background:var(--surface-soft);border-radius:var(--r-md);padding:12px 14px;font-size:14px;line-height:1.7}
.err-item{border-left:4px solid var(--accent-weak);padding:6px 10px;margin:8px 0;background:var(--surface-soft);border-radius:var(--r-xs);font-size:14px}
.err-item.primary{border-color:var(--accent)}
.notice{background:var(--paper);border:1px solid var(--hairline);color:var(--body-strong);border-radius:var(--r-md);padding:13px 16px;font-size:14px;margin-bottom:12px}
.notice.warn{background:var(--accent-weak);border-color:var(--accent-weak);color:var(--body-strong)}
.katex{font-size:1.05em}

/* 결과로 스크롤할 때 위쪽 고정 막대에 가리지 않게 */
#resultBox,.chat-wrap{scroll-margin-top:80px}

/* 문항 은행 위쪽 출제 줄 */
.assign-bar{background:var(--surface-card);border-radius:var(--r-md);padding:12px 14px;margin-bottom:12px}

/* ===================== 직접 쓰기 (그림판) ===================== */
/* 팝업(100)·로딩(150)·알림(200)이 그림판 위에 보이도록 그림판은 그보다 아래에 둔다 */
.draw-overlay{position:fixed;inset:0;z-index:90;background:var(--surface-soft);display:flex;flex-direction:column}
body:has(.draw-overlay){overflow:hidden}
.draw-head{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--canvas);border-bottom:1px solid var(--hairline);flex-wrap:wrap}
.draw-head>b{font-weight:600;color:var(--ink)}
.draw-bar{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.draw-bar::-webkit-scrollbar{display:none}
.draw-btn{flex:none;height:38px;padding:0 14px;border-radius:var(--r-pill);border:1px solid var(--hairline);background:var(--paper);color:var(--ink);font-size:13.5px;font-weight:600;white-space:nowrap}
.draw-btn.on{background:var(--key);border-color:var(--primary);color:var(--on-primary)}
.draw-sel{flex:none;height:38px;border-radius:var(--r-pill);border:1px solid var(--hairline);background:var(--paper);padding:0 10px;font-size:13.5px}
.draw-wrap{flex:1;min-height:0;margin:12px;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--hairline);
  background:var(--paper) repeating-linear-gradient(var(--paper) 0 47px,var(--hairline-soft) 47px 48px)}
.draw-wrap{position:relative}
.draw-canvas{display:block;touch-action:none;cursor:crosshair}
.draw-prob{position:absolute;top:10px;left:10px;z-index:2;width:min(46%,340px);max-height:38%;display:flex;flex-direction:column;overflow:hidden;background:color-mix(in srgb,var(--canvas) 97%,transparent);border:1px solid var(--hairline);border-radius:var(--r-lg);box-shadow:0 8px 22px rgba(10,10,10,.10);padding:8px 10px 10px}
.draw-prob-body{flex:1 1 auto;min-height:0;overflow:auto;padding-right:2px}
.draw-prob.sized .problem-img{width:100%;max-width:none}
.draw-prob.resizing{user-select:none;box-shadow:0 0 0 2px var(--ink),0 8px 22px rgba(10,10,10,.14)}
.draw-prob-resize{position:absolute;right:0;bottom:0;width:30px;height:30px;cursor:nwse-resize;touch-action:none;z-index:3;
  background:linear-gradient(135deg,transparent 0 52%,var(--muted-soft) 52% 58%,transparent 58% 68%,var(--muted-soft) 68% 74%,transparent 74% 84%,var(--muted-soft) 84% 90%,transparent 90%);border-bottom-right-radius:var(--r-lg)}
.draw-prob-resize:hover,.draw-prob.resizing .draw-prob-resize{background:linear-gradient(135deg,transparent 0 52%,var(--ink) 52% 58%,transparent 58% 68%,var(--ink) 68% 74%,transparent 74% 84%,var(--ink) 84% 90%,transparent 90%)}
.draw-prob.closed{width:auto;max-height:none;padding:0;border:none;box-shadow:none;background:transparent}
.draw-prob-head{display:flex;align-items:center;justify-content:space-between;font-size:13px;margin-bottom:6px}
.draw-prob-fold{border:1px solid var(--hairline);background:var(--paper);border-radius:var(--r-pill);font-size:12px;font-weight:600;padding:4px 10px}
.draw-prob-chip{height:36px;padding:0 14px;border-radius:var(--r-pill);border:none;background:var(--key);color:var(--on-primary);font-size:13px;font-weight:600;box-shadow:0 4px 12px rgba(10,10,10,.14)}
.draw-prob .problem-text{font-size:14px;line-height:1.6}
.draw-prob .zoom-hint{display:block;padding-right:28px}
.draw-foot{display:flex;align-items:center;gap:8px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:var(--canvas);border-top:1px solid var(--hairline)}
.draw-foot .muted{flex:1}

/* ===================== 휴대폰 화면 (기본 규칙보다 뒤에 있어야 적용됨) ===================== */
@media (max-width:900px){.login-hero{grid-template-columns:1fr;gap:24px;padding:28px 16px;min-height:0}.login-hero .display-xl{font-size:36px}.login-card{max-width:none}.home-hero{grid-template-columns:1fr}}
@media (max-width:640px){.page{padding:14px 16px 80px}.topbar{padding:0 12px;height:56px}.section-title{font-size:22px;margin:24px 2px 12px}.display-md{font-size:24px;letter-spacing:-0.4px}.login-steps{display:none}.login-card{padding:24px 20px 28px}.result{padding:20px}.work{grid-template-columns:minmax(0,1fr)}.understand{padding:12px 14px}.understand .q{min-width:0}.photo-btns{flex-direction:row;flex-wrap:wrap}.photo-btns .btn{flex:1 1 30%;padding:0 6px;font-size:13px;white-space:nowrap}.draw-foot .muted{display:none}.draw-foot .btn{flex:1}.draw-head>b{display:none}.draw-bar{flex-wrap:wrap;overflow:visible}.draw-btn,.draw-sel{height:36px;padding:0 11px;font-size:13px}.draw-wrap{margin:8px}.symbar{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;padding-bottom:6px;margin:0 -12px 8px;padding-left:12px;padding-right:12px}.sym{flex:none;min-width:36px;height:36px;padding:0 7px}.line-row{padding:6px}.line-top{gap:4px}.line-no{width:14px;font-size:12px}.line-input{padding:0 6px}.line-del{width:28px;height:28px}.line-prev,.line-ask{margin-left:18px}.tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:4px;margin-bottom:16px}.tabs::-webkit-scrollbar{display:none}.tab{flex:none;height:40px;padding:0 14px;font-size:14px;white-space:nowrap}.folder-grid{grid-template-columns:1fr;gap:10px}.folder{padding:16px}.tbl th,.tbl td{padding:10px 6px}.roster th,.roster td{white-space:nowrap}.roster th:nth-child(6),.roster td:nth-child(6){display:none}.roster td:nth-child(2) .badge{display:none}.tbl .btn.sm{padding:0 8px;font-size:12px;white-space:nowrap}.bank th:nth-child(4),.bank td:nth-child(4){display:none}.assign thead{display:none}.assign,.assign tbody{display:block}.assign tr{display:grid;grid-template-columns:22px auto minmax(0,1fr) auto;column-gap:8px;row-gap:4px;align-items:center;padding:12px 6px;border-bottom:1px solid var(--hairline)}.assign td{display:block;padding:0!important;border:none!important;width:auto!important}.assign td:nth-child(1){grid-column:1;grid-row:1/span 3}.assign td:nth-child(2){grid-column:2;grid-row:1/span 3}.assign td:nth-child(3){grid-column:3;grid-row:1}.assign td:nth-child(4){grid-column:3;grid-row:2;font-size:13px;color:var(--muted)}.assign td:nth-child(5){grid-column:3;grid-row:3;font-size:13px;color:var(--muted)}.assign td:nth-child(6){grid-column:4;grid-row:1;text-align:right}.assign td:nth-child(7){grid-column:4;grid-row:2/span 2;text-align:right;align-self:start}.progress-num{font-size:36px}.modal{padding:22px 18px}}

/* ===================== 학습 리포트 ===================== */
.report-page{max-width:800px}
.report{display:flex;flex-direction:column;gap:14px}
.report-card{background:var(--paper);border:1px solid var(--hairline);border-radius:var(--r-lg);padding:22px;box-shadow:var(--shadow)}
.report-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700;font-size:17px;letter-spacing:-0.2px;color:var(--ink);margin-bottom:14px}
.report-title::before{content:"";width:3px;height:15px;border-radius:2px;background:var(--key);flex:none}
.pie-wrap{display:flex;align-items:center;gap:28px;flex-wrap:wrap;justify-content:center}
.pie{width:220px;height:220px;flex:none}
.pie-slice{cursor:pointer;stroke:var(--paper);stroke-width:2;transition:opacity .15s}
.pie-slice:hover{opacity:.85}
.pie-center{text-anchor:middle;font-size:30px;font-weight:700;letter-spacing:-0.8px;fill:var(--ink)}
.pie-center-sub{text-anchor:middle;font-size:13px;fill:var(--muted)}
.pie-legend{display:flex;flex-direction:column;gap:8px;flex:1;min-width:200px;max-width:320px}
.legend-btn{display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;border-radius:var(--r-md);border:1px solid var(--hairline);background:var(--paper);color:var(--ink);font-size:15px;text-align:left}
.legend-btn:hover:not(:disabled){border-color:var(--ink)}
.legend-btn .dot{width:14px;height:14px;border-radius:50%;flex:none}
.legend-btn .lg-label{flex:1}
.legend-btn .lg-arrow{color:var(--muted);font-size:20px}
.summary-lines{margin:0;padding-left:20px;line-height:1.75}
.summary-lines li{margin-bottom:6px}
.summary-foot{display:flex;align-items:center;gap:8px;margin-top:6px}
.score-line{display:flex;align-items:baseline;gap:6px}
.score-big{font-size:48px;font-weight:700;letter-spacing:-1.2px;line-height:1;color:var(--key)}
.score-max{font-size:18px;color:var(--muted);font-weight:500}
.score-bar{height:10px;border-radius:var(--r-pill);background:var(--surface-card);overflow:hidden;margin-top:12px}
.score-bar>div{height:100%;background:var(--key);border-radius:var(--r-pill)}
.rep-item{border:1px solid var(--hairline);border-left-width:5px;border-radius:var(--r-md);padding:14px 16px;background:var(--paper)}
.rep-item.ok{border-left-color:var(--chart-correct)}.rep-item.bad{border-left-color:var(--chart-wrong)}
.rep-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rep-concept{font-weight:600;color:var(--ink)}
.rep-prev{color:var(--muted);font-size:14px;margin-top:6px;line-height:1.6}
.rep-cause{margin-top:10px;font-size:14px;line-height:1.6}
.mis-box{margin-top:10px;background:var(--hl);border-radius:var(--r-md);padding:12px 14px;font-size:14px;line-height:1.6}
.mis-box .mis-title{font-weight:600;margin-bottom:4px;color:var(--ink)}
.mis-box ul{margin:0;padding-left:18px}
.rep-reason{margin-top:8px;font-size:13px;color:var(--body);line-height:1.6}
.rep-reason summary{cursor:pointer;color:var(--muted)}
.rep-problem{margin-top:8px;border-top:1px dashed var(--hairline);padding-top:8px}
@media (max-width:640px){.pie{width:180px;height:180px}.pie-legend{max-width:none}.score-big{font-size:44px}.report-card{padding:18px}}
.deficit-badge{display:inline-block;padding:6px 14px;border-radius:var(--r-pill);font-weight:600;font-size:14px;background:var(--surface-card);color:var(--ink);white-space:nowrap}
.deficit-badge.sm{padding:3px 10px;font-size:12px}
.deficit-badge.green{background:var(--key-weak);color:var(--key)}
.deficit-badge.yellow{background:var(--hl);color:#7a5a00}
.deficit-badge.orange{background:var(--accent-weak);color:#9a4410}
.deficit-badge.red{background:var(--danger-weak);color:var(--danger)}
.deficit-card{border-left:4px solid var(--danger)}
.deficit-row{display:flex;gap:8px;flex-wrap:wrap}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--paper);border:1px solid var(--hairline);border-radius:var(--r-lg);padding:16px 18px;box-shadow:var(--shadow)}
.stat-v{font-size:28px;font-weight:700;letter-spacing:-0.6px;line-height:1.15;color:var(--key);margin-top:6px}
/* 데이터 보기 */
.data-wrap{max-height:65vh;overflow:auto;border:1px solid var(--hairline);border-radius:var(--r-md)}
.data-tbl{border:none;border-radius:0;font-size:13px}

.data-pre{white-space:pre-wrap;word-break:break-all;background:var(--surface-soft);border-radius:var(--r-md);padding:12px;font-size:13px;max-height:65vh;overflow:auto;margin:0}
.pager{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:12px}
.legend-btn.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
/* 출제 목록: 체크칸과 순서 번호를 한 줄에 */
@media (min-width:641px){.tbl.assign td.assign-no{width:1%;white-space:nowrap}.tbl.assign td:nth-child(4){white-space:nowrap}}
/* 문제별 AI 분석: 줄 간격을 넉넉하게 */
.analysis-kv{grid-template-columns:96px 1fr;gap:12px 14px;line-height:1.65;font-size:14.5px}
.analysis-kv .muted.small{margin-top:4px;line-height:1.6}
.kv-list{margin:0;padding-left:18px}
.kv-list li+li{margin-top:4px}
.pre-lines>div{padding:3px 0}
.err-item{line-height:1.65;padding:12px 14px;margin:10px 0}
.err-item .err-head{margin-bottom:4px}
.err-item .err-sub{color:var(--muted);font-size:13px;margin-top:6px}
.err-item .err-sub b{color:var(--body);font-weight:600;margin-right:4px}

/* [도움 받기] 설명 카드 (라벤더) */
#helpBox{scroll-margin-top:80px}
.result.help-result{background:var(--lav-weak);border:none;margin:0 0 14px;line-height:1.7}
.help-text{font-size:16px}
.help-sub{font-weight:600;margin:14px 0 6px}
.help-check{margin-top:14px;background:var(--paper);border-radius:var(--r-md);padding:12px 14px;font-size:15px}
.help-ask{margin-top:16px;padding-top:14px;border-top:1px dashed var(--box-strong);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.help-ask-q{font-weight:600;font-size:18px;letter-spacing:-0.2px}
.help-loading-row{display:flex;align-items:center;gap:14px}
.help-loading .spinner{flex:none;border-color:var(--box-strong);border-top-color:var(--key)}
.help-progress{margin-top:14px;height:6px;border-radius:var(--r-pill);background:var(--box-strong);overflow:hidden}
.help-progress>div{width:35%;height:100%;border-radius:var(--r-pill);background:var(--lav-ink);animation:helpbar 1.4s ease-in-out infinite}
@keyframes helpbar{0%{transform:translateX(-100%)}100%{transform:translateX(290%)}}
.help-btn:disabled{opacity:1;color:var(--key);border-color:var(--box-strong);background:var(--box);display:inline-flex;align-items:center;gap:6px}
.help-btn .spinner.sm{border-color:var(--box-strong);border-top-color:var(--key)}
/* 오개념 후보(교사 화면) */
.cand-list{display:flex;flex-direction:column;gap:8px;margin-top:6px}

    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

/**
 * 서버 함수 호출 통로. Apps Script에서는 google.script.run, 그 밖(Vercel 배포)에서는 /api/rpc로 보낸다.
 * 두 경우 모두 runner.withSuccessHandler(…).withFailureHandler(…)[fn](…args) 모양으로 쓴다.
 */
function serverRunner() {
  if (window.google && google.script && google.script.run) return google.script.run;
  var ok = null, fail = null;
  var r = new Proxy({}, {
    get: function (_, name) {
      if (name === 'withSuccessHandler') return function (f) { ok = f; return r; };
      if (name === 'withFailureHandler') return function (f) { fail = f; return r; };
      return function () {
        var args = Array.prototype.slice.call(arguments);
        fetch('/api/rpc', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fn: name, args: args }) })
          .then(function (res) { return res.json().catch(function () { throw new Error('서버 응답을 읽지 못했어요 (' + res.status + ')'); }); })
          .then(function (data) { if (ok) ok(data); })
          .catch(function (e) { if (fail) fail(e); });
      };
    }
  });
  return r;
}

/** 서버 함수를 Promise로. 동시 접속 오류는 잠시 뒤 다시 시도 */
function api(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    var tries = 0;
    function run() {
      var runner = serverRunner()
        .withSuccessHandler(function (res) {
          if (!res) { resolve(null); return; }
          if (res.ok) { resolve(res.data); return; }
          if (res.code === 'AUTH') { setToken(null); S.profile = null; renderLogin('student'); }
          var e = new Error(res.error || '오류가 발생했어요.');
          e.code = res.code;
          reject(e);
        })
        .withFailureHandler(function (err) {
          var msg = String((err && err.message) || err || '');
          if (tries < 3 && /simultaneous|too many|NetworkError|network|동시/i.test(msg)) {
            tries++;
            setTimeout(run, 1200 * tries + Math.random() * 800);
            return;
          }
          reject(new Error(msg || '서버와 연결하지 못했어요. 잠시 후 다시 시도해 주세요.'));
        });
      runner[fn].apply(runner, args);
    }
    run();
  });
}

/** opt: {title, body, actions:[{label, primary, danger, onClick(close)}], wide, sticky} */
function openModal(opt) {
  var back = h('div', { class: 'modal-back' });
  var box = h('div', { class: 'modal' + (opt.wide ? ' wide' : '') });
  function close() { if (back.parentNode) back.parentNode.removeChild(back); if (opt.onClose) opt.onClose(); }
  if (opt.title) box.appendChild(h('h3', null, opt.title));
  appendKid(box, opt.body);
  var foot = h('div', { class: 'foot' });
  (opt.actions || [{ label: '닫기' }]).forEach(function (a) {
    foot.appendChild(h('button', {
      class: 'btn' + (a.primary ? ' primary' : '') + (a.danger ? ' danger' : ''),
      onclick: function () { if (a.onClick) a.onClick(close); else close(); }
    }, a.label));
  });
  box.appendChild(foot);
  back.appendChild(box);
  back.addEventListener('click', function (e) { if (e.target === back && !opt.sticky) close(); });
  document.body.appendChild(back);
  return { close: close, box: box };
}

function insertAtCaret(el, text, back) {
  var start = typeof el.selectionStart === 'number' ? el.selectionStart : el.value.length;
  var end = typeof el.selectionEnd === 'number' ? el.selectionEnd : start;
  el.value = el.value.slice(0, start) + text + el.value.slice(end);
  var pos = start + text.length - (back || 0);
  el.focus();
  try { el.setSelectionRange(pos, pos); } catch (e) { /* 무시 */ }
  el.dispatchEvent(new Event('input', { bubbles: true }));
}

var SYMBOLS = [['x²', '²'], ['xⁿ', '^()', 1], ['√', '√()', 1], ['분수', '()/()', 4], ['+'], ['−', '-'], ['±'], ['×'], ['÷'], ['='], ['≠'], ['<'], ['>'], ['≤'], ['≥'],
  ['('], [')'], ['π'], ['°'], ['sin', 'sin '], ['cos', 'cos '], ['tan', 'tan '], ['∠'], ['AB̅ 선분', '\\overline{}', 1], ['△'], ['⊥'], ['∥'], ['≡'], ['∽'], ['→'], ['∴'], ['또는', ' 또는 ']];

/**
 * 체크박스 목록에서 Shift를 누르고 클릭하면 마지막으로 누른 칸부터 지금 칸까지 같은 상태로 바꾼다.
 * boxes는 화면 순서대로의 체크박스 배열(비활성 칸은 건너뜀).
 */
function shiftSelect(boxes) {
  var last = null;
  boxes.forEach(function (cb) {
    cb.addEventListener('click', function (e) {
      if (e.shiftKey && last && last !== cb) {
        var a = boxes.indexOf(last), b = boxes.indexOf(cb);
        for (var k = Math.min(a, b); k <= Math.max(a, b); k++) if (!boxes[k].disabled) boxes[k].checked = cb.checked;
        cb.dispatchEvent(new Event('change', { bubbles: true }));
      }
      last = cb;
    });
  });
}

/** 중3 수준 기호 버튼. fallback(): 포커스된 칸이 없을 때 넣을 칸 */
function symbolBar(fallback) {
  var bar = h('div', { class: 'symbar' });
  SYMBOLS.forEach(function (s) {
    var ins = s[1] || s[0], back = s[2] || 0;
    var b = h('button', { class: 'sym', type: 'button', title: ins.trim() }, s[0]);
    function doIns() {
      var t = (S.lastField && document.body.contains(S.lastField) && bar.parentNode && bar.parentNode.contains(S.lastField)) ? S.lastField : (fallback ? fallback() : null);
      if (t) insertAtCaret(t, ins, back);
    }
    b.addEventListener('mousedown', function (e) { e.preventDefault(); });
    b.addEventListener('touchstart', function (e) { e.preventDefault(); doIns(); }, { passive: false });
    b.addEventListener('click', doIns);
    bar.appendChild(b);
  });
  return bar;
}

/** 휴대폰 사진을 1600px JPEG로 줄여 업로드 */
function compressImage(file) {
  return new Promise(function (resolve, reject) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var w = img.naturalWidth, hgt = img.naturalHeight;
      var scale = Math.min(1, 1600 / Math.max(w, hgt));
      w = Math.round(w * scale); hgt = Math.round(hgt * scale);
      var c = document.createElement('canvas');
      c.width = w; c.height = hgt;
      var ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, hgt);
      ctx.drawImage(img, 0, 0, w, hgt);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('사진을 열 수 없어요. 다른 사진으로 시도해 주세요.')); };
    img.src = url;
  });
}

/* ===================== 수식 표시 ===================== */
/* 1) 학생 풀이(평문 표기: x^2, √(3), (a)/(b), ±, ×...) → LaTeX → KaTeX
   2) 문제·튜터 문장 속 $...$ LaTeX → KaTeX */

var SYMBOL_LATEX = { '×': '\\times ', '÷': '\\div ', '±': '\\pm ', '∓': '\\mp ', '≠': '\\neq ', '≤': '\\le ', '≥': '\\ge ', 'π': '\\pi ',
  '∠': '\\angle ', '△': '\\triangle ', '⊥': '\\perp ', '∥': '\\parallel ', '≡': '\\equiv ', '∽': '\\backsim ', '→': '\\rightarrow ',
  '∴': '\\therefore ', '∵': '\\because ', '·': '\\cdot ', '*': '\\times ', '{': '\\{', '}': '\\}', '%': '\\%', '#': '\\#', '&': '\\&',
  '_': '\\_', '~': '\\sim ', '\\': '\\backslash ', '$': '\\$', '−': '-', '–': '-', '，': ',' };

/**
 * 학생이 곱하기를 알파벳 x로 적은 경우만 ×로 바꾼다.
 * - 숫자 x 숫자: 2x3, 2 x 3
 * - 띄어 쓴 홀로 x가 두 식 사이에 있을 때: (a+1) x (a-1), 3 x √2
 * 2x+3, 3x², x(x+1) 같은 변수 x는 그대로 둔다.
 */
function normalizeTimes(src) {
  return String(src || '')
    .replace(/(\d)\s*[xX]\s*(?=\d)/g, '$1×')
    .replace(/([\d)\]²³])\s+[xX]\s+(?=[\d(\[√])/g, '$1 × ');
}

/* AI 전사나 학생이 쓴 LaTeX 명령 중 자주 나오는 것은 그대로 수식으로 살린다(예: \overline{AB}, \angle). */
var LATEX_ONE_ARG = { overline: 1, sqrt: 1, bar: 1, vec: 1, widehat: 1, overarc: 'overgroup', text: 1, mathrm: 1, boxed: 1 };
var LATEX_SYMBOLS = { angle: 1, triangle: 1, times: 1, div: 1, pm: 1, mp: 1, le: 1, ge: 1, leq: 1, geq: 1, ne: 1, neq: 1, pi: 1,
  circ: 1, perp: 1, parallel: 1, therefore: 1, because: 1, cdot: 1, sim: 1, equiv: 1, rightarrow: 1, theta: 1, alpha: 1, beta: 1,
  sin: 1, cos: 1, tan: 1, degree: 'circ', triangleq: 1, backsim: 1 };

function plainToLatex(src) {
  var s = normalizeTimes(src);
  var i = 0, n = s.length;
  function join(us) { return us.map(function (u) { return u.tex; }).join(''); }
  function argOf(a) { return a ? (a.kind === 'group' ? a.inner : a.tex) : ''; }
  function skipSp() { while (s[i] === ' ') i++; }
  /** {…} 안을 읽는다. 중괄호가 없으면 바로 다음 한 덩어리를 인자로 쓴다. */
  function braceArg() {
    skipSp();
    if (s[i] === '{') {
      i++;
      var inner = parseSeq('}');
      if (s[i] === '}') i++;
      return join(inner);
    }
    return argOf(parseAtom());
  }
  function parseAtom() {
    var ch = s[i];
    if (ch === undefined) return null;
    if (ch === '\\') {
      var cm = s.slice(i).match(/^\\([a-zA-Z]+)/);
      if (cm) {
        var name = cm[1];
        if (name === 'frac' || name === 'dfrac' || name === 'tfrac') {
          i += cm[0].length;
          var fa = braceArg(), fb = braceArg();
          return { tex: '\\frac{' + fa + '}{' + fb + '}', op: true, kind: 'frac' };
        }
        if (LATEX_ONE_ARG[name]) {
          i += cm[0].length;
          var cmd = LATEX_ONE_ARG[name] === 1 ? name : LATEX_ONE_ARG[name];
          return { tex: '\\' + cmd + '{' + braceArg() + '}', op: true, kind: 'cmd' };
        }
        if (LATEX_SYMBOLS[name]) {
          i += cm[0].length;
          var sym = LATEX_SYMBOLS[name] === 1 ? name : LATEX_SYMBOLS[name];
          return { tex: '\\' + sym + ' ', op: sym === 'pi' || sym === 'theta' || sym === 'alpha' || sym === 'beta', kind: 'sym' };
        }
        if (name === 'left' || name === 'right') { i += cm[0].length; return { tex: '', op: false, kind: 'skip' }; }
      }
    }
    if (/[0-9.]/.test(ch)) {
      var m = s.slice(i).match(/^[0-9]+(\.[0-9]+)?|^\.[0-9]+/);
      var t = m ? m[0] : ch;
      i += t.length;
      return { tex: t, op: true, kind: 'num' };
    }
    if (ch === '(' || ch === '[') {
      var close = ch === '(' ? ')' : ']';
      i++;
      var inner = parseSeq(close);
      var closed = s[i] === close;
      if (closed) i++;
      var it = join(inner);
      return { tex: '\\left' + ch + it + '\\right' + (closed ? close : '.'), op: true, kind: 'group', inner: it };
    }
    if (ch === '√') {
      i++; skipSp();
      return { tex: '\\sqrt{' + argOf(parseAtom()) + '}', op: true, kind: 'sqrt' };
    }
    if (/[a-zA-Z]/.test(ch)) {
      var fm = s.slice(i).match(/^(sin|cos|tan)/);
      if (fm) { i += 3; return { tex: '\\' + fm[0] + ' ', op: false, kind: 'fn' }; }
      i++;
      return { tex: ch, op: true, kind: 'letter' };
    }
    return null;
  }
  function attachSup(units, arg) {
    var last = units[units.length - 1];
    if (last && last.op) { last.tex = '{' + last.tex + '}^{' + arg + '}'; last.kind = 'sup'; }
    else units.push({ tex: '{}^{' + arg + '}', op: true, kind: 'sup' });
  }
  function atomWithSup() {
    var a = parseAtom();
    if (!a) return null;
    while (s[i] === '²' || s[i] === '³' || s[i] === '^') {
      if (s[i] === '^') { i++; a = { tex: '{' + a.tex + '}^{' + argOf(parseAtom()) + '}', op: true, kind: 'sup' }; }
      else { a = { tex: '{' + a.tex + '}^{' + (s[i] === '²' ? '2' : '3') + '}', op: true, kind: 'sup' }; i++; }
    }
    return a;
  }
  function unitInto(units) {
    var ch = s[i];
    if (ch === ' ') { i++; return; }
    if (ch === '²' || ch === '³') { attachSup(units, ch === '²' ? '2' : '3'); i++; return; }
    if (ch === '°') { attachSup(units, '\\circ'); i++; return; }
    if (ch === '^') { i++; attachSup(units, argOf(parseAtom())); return; }
    if (ch === '/') {
      i++;

  if (opt.studentId && rep.progress && !rep.progress.ready) {
    root.appendChild(h('div', { class: 'notice warn', style: { marginBottom: 0 } }, h('b', null, '과제 진행 중이에요 (' + rep.progress.done + '/' + rep.progress.total + ' 완료). '),
      '지금까지 푼 문제로 만든 리포트라 결과가 달라질 수 있어요. 학생은 과제를 모두 마친 뒤에 리포트를 볼 수 있어요.'));
  }
  if (rep.deficit) root.appendChild(deficitCard(rep.deficit));

  // 1) 원 그래프: 처음 풀이 기준 맞은 문제·틀린 문제
  var pieCard = h('div', { class: 'report-card' }, h('div', { class: 'report-title' }, '맞은 문제와 틀린 문제'));
  if (!done) {
    pieCard.appendChild(h('div', { class: 'notice' }, '아직 채점된 문제가 없어요. 문제를 풀면 여기에 결과가 보여요.'));
  } else {
    var groups = [
      { key: 'O', label: '맞은 문제', n: rep.correct, color: 'var(--chart-correct)' },
      { key: 'X', label: '틀린 문제', n: rep.wrong, color: 'var(--chart-wrong)' }
    ];
    var pick = function (g) { if (g.key === 'X') openWrongBreakdown(rep, opt); else openReportList(rep, g, opt); };
    var legend = h('div', { class: 'pie-legend' });
    groups.forEach(function (g) {
      legend.appendChild(h('button', { class: 'legend-btn', type: 'button', disabled: !g.n, onclick: function () { pick(g); } },
        h('span', { class: 'dot', style: { background: g.color } }), h('span', { class: 'lg-label' }, g.label),
        h('b', null, g.n + '개'), h('span', { class: 'muted small' }, Math.round(g.n * 100 / done) + '%'), h('span', { class: 'lg-arrow' }, '›')));
    });
    pieCard.appendChild(h('div', { class: 'pie-wrap' }, reportPie(groups, done, [Math.round(rep.correct * 100 / done) + '%', '정답률'], pick), legend));
    pieCard.appendChild(h('div', { class: 'muted small', style: { marginTop: '10px' } }, '그래프 조각이나 버튼을 누르면 어떤 문제를 맞히고 틀렸는지 볼 수 있어요. 처음 풀이를 기준으로 해요.'));
  }
  if (rep.excluded) pieCard.appendChild(h('div', { class: 'muted small', style: { marginTop: '6px' } }, '변별도 정보가 없는 문제 ' + rep.excluded + '개는 리포트에서 뺐어요.'));
  if (rep.pending) pieCard.appendChild(h('div', { class: 'notice', style: { marginTop: '10px', marginBottom: 0 } }, '선생님이 확인 중인 문제 ' + rep.pending + '개는 결과가 나오면 반영돼요.'));
  root.appendChild(pieCard);

  // 2) AI 학습 평가 3줄
  var sumBody = h('div');
  var sumCard = h('div', { class: 'report-card' }, h('div', { class: 'report-title' }, '학습 평가'), sumBody);
  root.appendChild(sumCard);
  function loadSummary(saved) {
    sumBody.innerHTML = '';
    if (!done) { sumBody.appendChild(h('div', { class: 'muted' }, '문제를 풀면 AI가 학습 평가를 써 줘요.')); return; }
    sumBody.appendChild(inlineLoad('AI가 평가를 쓰고 있어요… (10~30초)'));
    (saved ? Promise.resolve(saved) : opt.summary()).then(function (res) {
      sumBody.innerHTML = '';
      var lines = (res && res.lines) || [];
      if (!lines.length) { sumBody.appendChild(h('div', { class: 'muted' }, '문제를 풀면 AI가 학습 평가를 써 줘요.')); return; }
      sumBody.appendChild(h('ul', { class: 'summary-lines' }, lines.map(function (l) { return h('li', { html: richHtml(l) }); })));
      var foot = h('div', { class: 'muted small summary-foot' }, 'AI가 풀이 기록을 보고 쓴 평가예요. 새로 푼 문제가 생기면 다시 써요.' + (res.at ? ' (' + String(res.at).slice(0, 16) + ')' : ''));
      sumBody.appendChild(foot);
    }).catch(function (e) {
      sumBody.innerHTML = '';
      var msg = (e.code === 'NOKEY' && opt.studentId) ? 'AI API 키가 아직 없어요. 오른쪽 위 ⚙ 설정에서 입력하면 학습 평가를 쓸 수 있어요.' : e.message;
      sumBody.appendChild(h('div', { class: 'notice warn', style: { marginBottom: '8px' } }, msg));
      sumBody.appendChild(h('button', { class: 'btn sm', onclick: function () { loadSummary(null); } }, '다시 시도'));
    });
  }
  loadSummary(rep.summary && rep.summary.lines && rep.summary.lines.length ? rep.summary : null);

  // 3) 총점: Σ(변별도×정오) / Σ(변별도) 를 100점 만점으로
  var sc = rep.score || {};
  root.appendChild(h('div', { class: 'report-card' },
    h('div', { class: 'report-title' }, '총점'),
    done ? h('div', { class: 'score-line' }, h('span', { class: 'score-big' }, fmtNum(sc.percent, 1)), h('span', { class: 'score-max' }, ' / 100점')) : h('div', { class: 'muted' }, '-'),
    done ? h('div', { class: 'score-bar' }, h('div', { style: { width: Math.max(0, Math.min(100, sc.percent)) + '%' } })) : null,
    h('div', { class: 'muted small', style: { marginTop: '8px' } }, '문제마다 변별도(실력을 잘 구별하는 정도)를 반영한 점수예요. 변별도가 높은 문제를 맞힐수록 점수가 더 올라가요.' +
      (done ? ' (얻은 점수 ' + fmtNum(sc.earned, 2) + ' / 만점 ' + fmtNum(sc.max, 2) + ')' : ''))));

  // 4) 오개념 지도: 위계로 이어진 오개념, 여러 번 확인될수록 진하게
  root.appendChild(misGraphCard(rep.misGraph));
}

/* 틀린 문제의 오류 유형(주원인 Newman 단계) 색 */
// 색 순서는 검증 도구로 확인한 순서(이웃한 조각끼리 색각 이상에서도 구별되게). 범례에 이름·개수를 함께 쓴다.
var STAGE_COLORS = { '읽기': '#00897b', '이해': '#e8407a', '변형': '#b8860b', '처리기술': '#7a62d6', '인코딩': '#e86a3a', '기타': '#9a9a9a' };
var STAGE_SEQ = ['읽기', '이해', '변형', '처리기술', '인코딩', '기타'];

/** 틀린 문제 → 오류 유형 비율 원 그래프. 조각을 누르면 그 유형의 문제 목록을 아래에 보여 준다. */
function openWrongBreakdown(rep, opt) {
  var wrong = rep.items.filter(function (it) { return it.result === 'X'; });
  var stageOf = function (it) { return STAGE_COLORS[it.stage] && it.stage !== '기타' ? it.stage : '기타'; };
  var groups = STAGE_SEQ.map(function (s) {
    return { key: s, label: s, n: wrong.filter(function (it) { return stageOf(it) === s; }).length, color: STAGE_COLORS[s] };
  }).filter(function (g) { return g.n; });
  var listBox = h('div', { class: 'list', style: { marginTop: '14px' } });
  var legend = h('div', { class: 'pie-legend' });
  function show(g) {
    Array.prototype.forEach.call(legend.children, function (b) { b.classList.toggle('on', b.getAttribute('data-key') === g.key); });
    listBox.innerHTML = '';
    listBox.appendChild(h('div', { class: 'report-title', style: { margin: '4px 0 0' } }, g.label + ' 오류로 틀린 문제 (' + g.n + '개)'));
    var its = wrong.filter(function (it) { return stageOf(it) === g.key; });
    if (its[0] && its[0].stageExplain) listBox.appendChild(h('div', { class: 'muted small' }, its[0].stageExplain));
    its.forEach(function (it) { listBox.appendChild(reportItemCard(it, opt)); });
    setTimeout(function () { listBox.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 30);
  }
  groups.forEach(function (g) {
    var b = h('button', { class: 'legend-btn', type: 'button', onclick: function () { show(g); } },
      h('span', { class: 'dot', style: { background: g.color } }), h('span', { class: 'lg-label' }, g.label),
      h('b', null, g.n + '개'), h('span', { class: 'muted small' }, Math.round(g.n * 100 / wrong.length) + '%'), h('span', { class: 'lg-arrow' }, '›'));
    b.setAttribute('data-key', g.key);
    legend.appendChild(b);
  });
  var body = h('div', null,
    h('div', { class: 'muted small', style: { marginBottom: '10px' } }, '틀린 문제마다 가장 큰 원인이 된 오류 유형(Newman 단계)의 비율이에요. 조각이나 버튼을 누르면 그 유형으로 틀린 문제를 볼 수 있어요.'),
    h('div', { class: 'pie-wrap' }, reportPie(groups, wrong.length, [wrong.length + '개', '틀린 문제'], show), legend),
    listBox);
  openModal({ title: '틀린 문제의 오류 유형', wide: true, body: body });
}

/** 맞은 문제 / 틀린 문제 목록 팝업 */

/* ---------- 오개념 지도: 선수개념 위계로 이은 노드 그래프 ---------- */
/* 색(한 가지 색의 진하기)은 확인된 횟수: 1회 · 2회 · 3회 · 4회 이상. 아래쪽이 기초(선수) 개념, 화살표는 선수 → 후속. */
// 오개념 지도 색: 화면의 강조색 한 가지의 진하기(학생 = 진한 녹색, 교사 = 웜 오텀 적갈색). 검증 도구로 확인한 단계.
var MIS_RAMPS = {
  student: [
    { min: 1, label: '1회', fill: '#8cbf9f', ink: '#1a1a1a' },
    { min: 2, label: '2회', fill: '#4f8f69', ink: '#1a1a1a' },
    { min: 3, label: '3회', fill: '#2c6446', ink: '#ffffff' },
    { min: 4, label: '4회 이상', fill: '#173d2e', ink: '#ffffff' }],
  teacher: [
    { min: 1, label: '1회', fill: '#e0a281', ink: '#1a1a1a' },
    { min: 2, label: '2회', fill: '#cc7a4f', ink: '#1a1a1a' },
    { min: 3, label: '3회', fill: '#a94d26', ink: '#ffffff' },
    { min: 4, label: '4회 이상', fill: '#713016', ink: '#ffffff' }]
};
var MIS_RAMP = MIS_RAMPS.student;
function misShade(n) { var s = MIS_RAMP[0]; MIS_RAMP.forEach(function (r) { if (n >= r.min) s = r; }); return s; }

/** 이름을 한 줄 글자 수에 맞춰 최대 두 줄로 나눈다(넘치면 …). */
/** 툴팁용: 수식 기호를 걷어 낸 읽기 쉬운 글자 */
function misPlain(t) {
  return String(t || '').replace(/\$([^$]*)\$/g, function (m, x) { return x.replace(/\\(left|right|,|;|!)/g, '').replace(/\\[a-zA-Z]+/g, function (c) { return ({ '\\times': '×', '\\div': '÷', '\\pi': 'π', '\\sqrt': '√', '\\le': '≤', '\\ge': '≥', '\\ne': '≠', '\\pm': '±', '\\cdot': '·', '\\theta': 'θ' })[c] || ''; }).replace(/[{}]/g, ''); });
}

function misWrap(name, per) {
  var t = String(name || '').replace(/\s+/g, ' ').trim();
  if (t.length <= per) return [t];
  var cut = t.lastIndexOf(' ', per);
  if (cut < per * 0.5) cut = per;
  var a = t.slice(0, cut).trim(), b = t.slice(cut).trim();
  if (b.length > per) b = b.slice(0, per - 1) + '…';
  return [a, b];
}

function misGraphCard(g) {
  MIS_RAMP = document.body.classList.contains('theme-teacher') ? MIS_RAMPS.teacher : MIS_RAMPS.student;
  var card = h('div', { class: 'report-card mis-graph-card' }, h('div', { class: 'report-title' }, '오개념 지도'));
  if (!g || !g.nodes || !g.nodes.filter(function (n) { return !n.bridge; }).length) {
    card.appendChild(h('div', { class: 'muted' }, '아직 확인된 오개념이 없어요. 틀린 문제에서 오개념이 확인되면 여기에 지도로 보여 줘요.'));
    return card;
  }
  var byId = {};
  g.nodes.forEach(function (n) { byId[n.id] = n; });
  var up = {}, down = {}; // up[x] = x의 선수들, down[x] = x의 후속들
  g.edges.forEach(function (e) { (up[e.to] = up[e.to] || []).push(e.from); (down[e.from] = down[e.from] || []).push(e.to); });
  var linked = {};
  g.edges.forEach(function (e) { linked[e.from] = linked[e.to] = true; });
  var mis = g.nodes.filter(function (n) { return !n.bridge; });
  var chained = mis.filter(function (n) { return linked[n.id]; });
  var alone = mis.filter(function (n) { return !linked[n.id]; }).sort(function (a, b) { return b.count - a.count; });

  // 묶음(연결 요소) 세기: 오개념이 2개 이상 이어진 묶음
  var comp = {};
  function find(x) { while (comp[x] !== x) x = comp[x] = comp[comp[x]]; return x; }
  Object.keys(linked).forEach(function (x) { comp[x] = x; });
  g.edges.forEach(function (e) { comp[find(e.from)] = find(e.to); });
  var compMis = {};
  chained.forEach(function (n) { var r = find(n.id); compMis[r] = (compMis[r] || 0) + 1; });
  var chainCount = Object.keys(compMis).filter(function (k) { return compMis[k] >= 2; }).length;

  var top = mis.slice().sort(function (a, b) { return b.count - a.count; })[0];
  card.appendChild(h('div', { class: 'mis-summary' },
    h('span', null, '확인된 오개념 ', h('b', null, g.total + '개')),
    h('span', null, '위계로 이어진 묶음 ', h('b', null, chainCount + '개')),
    top.count >= 2 ? h('span', null, '가장 많이 확인 ', h('b', { html: richHtml(top.name) }), ' (' + top.count + '회)') : null));
  card.appendChild(h('div', { class: 'muted small', style: { marginBottom: '10px' } },
    '아래쪽이 먼저 배우는 기초(선수) 개념, 위쪽이 그 위에 쌓이는 개념이에요. 화살표는 "먼저 알아야 하는 개념 → 다음 개념"이고, 색이 진할수록 여러 번 확인된 오개념이에요. 개념을 누르면 이어진 오개념이 함께 표시돼요.' +
    (g.total > g.shown ? ' (많이 확인된 ' + g.shown + '개만 그렸어요)' : '')));

  // 범례
  var legend = h('div', { class: 'mis-legend' });
  MIS_RAMP.forEach(function (r) { legend.appendChild(h('span', { class: 'mis-lg' }, h('span', { class: 'mis-sw', style: { background: r.fill } }), r.label)); });
  if (g.nodes.some(function (n) { return n.bridge; })) legend.appendChild(h('span', { class: 'mis-lg' }, h('span', { class: 'mis-sw bridge' }), '사이를 잇는 선수개념(오개념 아님)'));
  if (g.edges.length) {
    legend.appendChild(h('span', { class: 'mis-lg' }, h('span', { class: 'mis-ln' }), '바로 선수 관계'));
    if (g.edges.some(function (e) { return !e.direct; })) legend.appendChild(h('span', { class: 'mis-lg' }, h('span', { class: 'mis-ln dash' }), '중간 개념을 거쳐 이어짐'));
  }
  card.appendChild(legend);

  var detail = h('div', { class: 'mis-detail', 'aria-live': 'polite' });
  var selected = null, svgNodes = {}, svgEdges = [], chipEls = {};

  function related(id) {
    var set = {}; set[id] = true;
    [[up, true], [down, false]].forEach(function (pair) {
      var stack = [id];
      while (stack.length) { var x = stack.pop(); (pair[0][x] || []).forEach(function (y) { if (!set[y]) { set[y] = true; stack.push(y); } }); }
    });
    return set;
  }
  function chainMis(id, map) {
    var out = [], seen = {}, stack = [id];
    while (stack.length) {
      var x = stack.pop();
      (map[x] || []).forEach(function (y) { if (seen[y]) return; seen[y] = true; stack.push(y); if (!byId[y].bridge) out.push(byId[y]); });
    }
    return out;
  }
  function select(id) {
    selected = selected === id ? null : id;
    var rel = selected ? related(selected) : null;
    Object.keys(svgNodes).forEach(function (k) {
      svgNodes[k].classList.toggle('dim', !!rel && !rel[k]);
      svgNodes[k].classList.toggle('sel', k === selected);
    });
    svgEdges.forEach(function (e) { e.el.classList.toggle('dim', !!rel && !(rel[e.from] && rel[e.to])); });
    Object.keys(chipEls).forEach(function (k) { chipEls[k].classList.toggle('dim', !!selected && k !== selected); chipEls[k].classList.toggle('sel', k === selected); });
    drawDetail();
  }
  function drawDetail() {
    detail.innerHTML = '';
    if (!selected) { detail.appendChild(h('div', { class: 'muted small' }, '개념을 누르면 자세한 내용이 여기에 보여요.')); return; }
    var n = byId[selected];
    var box = h('div', { class: 'mis-detail-box' });
    box.appendChild(h('div', { class: 'mis-detail-head' },
      n.bridge ? null : h('span', { class: 'mis-sw', style: { background: misShade(n.count).fill } }),
      h('b', { html: richHtml(n.name) }), n.grade ? h('span', { class: 'badge' }, n.grade) : null,
      n.bridge ? h('span', { class: 'muted small' }, '사이를 잇는 선수개념') : h('span', { class: 'muted small' }, n.count + '번 확인됨')));
    if (n.bridge) {
      box.appendChild(h('div', { class: 'small', style: { marginTop: '6px' } }, '이 개념은 오개념으로 확인되지는 않았지만, 아래·위의 오개념을 이어 주는 선수개념이에요. 두 오개념이 함께 나타난 까닭을 살필 때 같이 확인해 보면 좋아요.'));
    } else {
      var st = Object.keys(n.stages || {}).map(function (k) { return k + ' ' + n.stages[k] + '번'; });
      var meta = [];
      if (st.length) meta.push('오류 단계: ' + st.join(' · '));
      if (n.tutor) meta.push('유도질문에서 확인 ' + n.tutor + '번');
      if (n.last) meta.push('최근 확인 ' + n.last);
      if (meta.length) box.appendChild(h('div', { class: 'muted small', style: { marginTop: '4px' } }, meta.join(' / ')));
    }
    var pres = chainMis(selected, up), posts = chainMis(selected, down);
    function names(list) { return list.map(function (x) { return '‘' + x.name + '’(' + x.count + '회)'; }).join(', '); }
    if (pres.length) box.appendChild(h('div', { class: 'small mis-rel' }, h('b', null, '이어진 선수 쪽 오개념: '), h('span', { html: richHtml(names(pres)) })));
    if (posts.length) box.appendChild(h('div', { class: 'small mis-rel' }, h('b', null, '이어진 후속 쪽 오개념: '), h('span', { html: richHtml(names(posts)) })));
    if (!n.bridge && pres.length) box.appendChild(h('div', { class: 'small mis-tip' }, '💡 선수 쪽 오개념이 먼저 바로잡히면 이 개념의 오개념도 함께 풀릴 수 있어요. 아래쪽 개념부터 복습해 보세요.'));
    if (!n.bridge && !pres.length && !posts.length) box.appendChild(h('div', { class: 'small mis-rel muted' }, '위계로 이어진 다른 오개념은 없어요.'));
    detail.appendChild(box);
  }

  if (chained.length) card.appendChild(misGraphSvg(g, byId, up, down, select, svgNodes, svgEdges));
  if (alone.length) {
    card.appendChild(h('div', { class: 'mis-sub' }, chained.length ? '따로 확인된 오개념 (위계로 이어진 다른 오개념 없음)' : '확인된 오개념 (위계로 이어진 것은 없어요)'));
    var chips = h('div', { class: 'mis-chips' });
    alone.forEach(function (n) {
      var sh = misShade(n.count);
      var c = h('button', { class: 'mis-chip', type: 'button', style: { background: sh.fill, color: sh.ink }, title: misPlain(n.name) + ' · ' + (n.grade || '') + ' · ' + n.count + '번 확인', onclick: function () { select(n.id); } },
        h('span', { html: richHtml(n.name) }), h('span', { class: 'mis-chip-n' }, n.count + '회'));
      chipEls[n.id] = c;
      chips.appendChild(c);
    });
    card.appendChild(chips);
  }
  card.appendChild(detail);
  drawDetail();

  // 표로 보기(색을 구별하기 어려운 경우·인쇄용)
  var tb = h('tbody');
  mis.slice().sort(function (a, b) { return b.count - a.count; }).forEach(function (n) {
    tb.appendChild(h('tr', null, h('td', { html: richHtml(n.name) }), h('td', null, n.grade || '-'), h('td', null, n.count + '회'),
      h('td', { html: richHtml(chainMis(n.id, up).map(function (x) { return x.name; }).join(', ') || '-') }),
      h('td', { html: richHtml(chainMis(n.id, down).map(function (x) { return x.name; }).join(', ') || '-') })));
  });
  card.appendChild(h('details', { class: 'mis-table' }, h('summary', null, '표로 보기'),
    h('div', { class: 'tbl-wrap' }, h('table', { class: 'tbl' },
      h('thead', null, h('tr', null, h('th', null, '오개념'), h('th', null, '학년'), h('th', null, '확인 횟수'), h('th', null, '이어진 선수 오개념'), h('th', null, '이어진 후속 오개념'))), tb))));
  return card;
}

/** 이어진 오개념만 층으로 나눠 그린다: 아래층이 선수(기초), 화살표는 위로. */
function misGraphSvg(g, byId, up, down, onPick, svgNodes, svgEdges) {
  var ids = Object.keys(byId).filter(function (id) { return (up[id] && up[id].length) || (down[id] && down[id].length); });
  // 층: 가장 긴 선수 사슬의 길이(선수 없는 개념이 0층)
  var layer = {};
  ids.forEach(function (id) { layer[id] = 0; });
  for (var it = 0; it < ids.length + 1; it++) {
    var moved = false;
    g.edges.forEach(function (e) { if (layer[e.to] < layer[e.from] + 1 && layer[e.from] + 1 <= ids.length) { layer[e.to] = layer[e.from] + 1; moved = true; } });
    if (!moved) break;
  }
  var maxL = 0;
  ids.forEach(function (id) { maxL = Math.max(maxL, layer[id]); });
  var rows = [];
  for (var l = 0; l <= maxL; l++) rows.push([]);
  ids.sort(function (a, b) { return (byId[a].gradeRank - byId[b].gradeRank) || (byId[b].count || 0) - (byId[a].count || 0); })
    .forEach(function (id) { rows[layer[id]].push(id); });
  // 겹침 줄이기: 이웃 층 위치의 평균으로 위·아래 번갈아 정렬
  var pos = {};
  function index() { rows.forEach(function (r) { r.forEach(function (id, i) { pos[id] = (i + 0.5) / r.length; }); }); }
  index();
  for (var sweep = 0; sweep < 4; sweep++) {
    var order = sweep % 2 ? rows.slice().reverse() : rows;
    order.forEach(function (r) {
      r.sort(function (a, b) {
        function bc(x) { var nb = (sweep % 2 ? down[x] : up[x]) || []; nb = nb.filter(function (y) { return pos[y] !== undefined; }); return nb.length ? nb.reduce(function (s, y) { return s + pos[y]; }, 0) / nb.length : pos[x]; }
        return bc(a) - bc(b);
      });
      r.forEach(function (id, i) { pos[id] = (i + 0.5) / r.length; });
    });
  }
  var NW = 132, NH = 56, BW = 116, BH = 40, GX = 22, RH = 100, PADX = 16, PADT = 26, PADB = 26;
  var widest = Math.max.apply(null, rows.map(function (r) { return r.length; }));
  var W = Math.max(320, widest * (NW + GX) - GX + PADX * 2);
  var H = PADT + maxL * RH + NH + PADB;
  var minW = Math.round(W * 0.85);
  var xy = {};
  rows.forEach(function (r, L) {
    var rowW = r.reduce(function (s, id) { return s + (byId[id].bridge ? BW : NW); }, 0) + GX * (r.length - 1);
    var x = (W - rowW) / 2;
    var cy = PADT + (maxL - L) * RH + NH / 2;
    r.forEach(function (id) {
      var w = byId[id].bridge ? BW : NW, hh = byId[id].bridge ? BH : NH;
      xy[id] = { x: x, y: cy - hh / 2, w: w, h: hh, cx: x + w / 2 };
      x += w + GX;
    });
  });

  var svg = svgEl('svg', { class: 'mis-svg', viewBox: '0 0 ' + W + ' ' + H, role: 'img', style: { width: '100%', maxWidth: W + 'px', minWidth: minW + 'px' },
    'aria-label': '오개념 지도: 이어진 오개념 ' + ids.filter(function (id) { return !byId[id].bridge; }).length + '개' });
  var defs = svgEl('defs');
  [['misArrow', '#0a0a0a'], ['misArrowSoft', '#9a9a9a']].forEach(function (a) {
    defs.appendChild(svgEl('marker', { id: a[0], viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' },
      svgEl('path', { d: 'M0 1 L9 5 L0 9 Z', fill: a[1] })));
  });
  svg.appendChild(defs);
  svg.appendChild(svgEl('rect', { x: 0, y: 0, width: W, height: H, fill: 'transparent', onclick: function () { onPick(null); } }));
  if (maxL > 0) {
    var tTop = svgEl('text', { x: 6, y: 12, class: 'mis-axis' }); tTop.textContent = '▲ 심화';
    var tBot = svgEl('text', { x: 6, y: H - 8, class: 'mis-axis' }); tBot.textContent = '기초(선수)';
    svg.appendChild(tTop); svg.appendChild(tBot);
  }
  var eg = svgEl('g');
  g.edges.forEach(function (e) {
    var a = xy[e.from], b = xy[e.to];
    if (!a || !b) return;
    var x1 = a.cx, y1 = a.y, x2 = b.cx, y2 = b.y + b.h + 2, dy = Math.max(24, (y1 - y2) * 0.45);
    var p = svgEl('path', { d: 'M' + x1 + ' ' + y1 + ' C' + x1 + ' ' + (y1 - dy) + ' ' + x2 + ' ' + (y2 + dy) + ' ' + x2 + ' ' + y2,
      class: 'mis-edge' + (e.direct ? ' direct' : ''), 'marker-end': 'url(#' + (e.direct ? 'misArrow' : 'misArrowSoft') + ')' });
    svgEdges.push({ el: p, from: e.from, to: e.to });
    eg.appendChild(p);
  });
  svg.appendChild(eg);
  ids.forEach(function (id) {
    var n = byId[id], b = xy[id];
    var gg = svgEl('g', { class: 'mis-node' + (n.bridge ? ' bridge' : ''), tabindex: 0, role: 'button',
      onclick: function (ev) { ev.stopPropagation(); onPick(id); },
      onkeydown: function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); onPick(id); } } });
    var tt = svgEl('title');
    tt.textContent = misPlain(n.name) + (n.grade ? ' (' + n.grade + ')' : '') + (n.bridge ? ' · 사이를 잇는 선수개념' : ' · ' + n.count + '번 확인된 오개념');
    gg.appendChild(tt);
    var sh = n.bridge ? null : misShade(n.count);
    gg.appendChild(svgEl('rect', { x: b.x, y: b.y, width: b.w, height: b.h, rx: 10, class: 'mis-box', style: sh ? { fill: sh.fill } : {} }));
    // 이름에 수식이 있으면 SVG 글자로는 깨지므로 HTML(KaTeX)로 그린다
    if (/\$|\\\(/.test(n.name)) {
      var fo = svgEl('foreignObject', { x: b.x + 4, y: b.y + 7, width: b.w - 8, height: b.h - 10, class: 'mis-fo' });
      var lab = document.createElementNS('http://www.w3.org/1999/xhtml', 'div');
      lab.className = 'mis-html' + (n.bridge ? ' bridge' : '');
      lab.style.color = sh ? sh.ink : '#3a3a3a';
      var inner = document.createElementNS('http://www.w3.org/1999/xhtml', 'span');
      inner.innerHTML = richHtml(n.name);
      lab.appendChild(inner);
      fo.appendChild(lab);
      gg.appendChild(fo);
    } else {
      var lines = misWrap(n.name, n.bridge ? 9 : 10);
      lines.forEach(function (t, i) {
        var tx = svgEl('text', { x: b.cx, y: b.y + b.h / 2 + (i - (lines.length - 1) / 2) * 15 + 4.5, class: 'mis-label', style: { fill: sh ? sh.ink : '#3a3a3a' } });
        tx.textContent = t;
        gg.appendChild(tx);
      });
    }
    if (n.grade) {
      // 학년은 왼쪽 위 작은 표(아래쪽은 화살표가 들어오는 자리라 비워 둔다)
      var gw = 10 + n.grade.length * 11;
      gg.appendChild(svgEl('rect', { x: b.x - 4, y: b.y - 9, width: gw, height: 18, rx: 9, class: 'mis-grade-bg' }));
      var gt = svgEl('text', { x: b.x - 4 + gw / 2, y: b.y + 4, class: 'mis-grade' }); gt.textContent = n.grade; gg.appendChild(gt);
    }
    if (!n.bridge) {
      var label = n.count + '회', bw = 12 + label.length * 7;
      gg.appendChild(svgEl('rect', { x: b.x + b.w - bw + 6, y: b.y - 9, width: bw, height: 18, rx: 9, class: 'mis-badge', style: { stroke: sh.fill } }));
      var ct = svgEl('text', { x: b.x + b.w - bw / 2 + 6, y: b.y + 4, class: 'mis-badge-t' }); ct.textContent = label;
      gg.appendChild(ct);
    }
    svgNodes[id] = gg;
    svg.appendChild(gg);
  });
  var wrap = h('div', { class: 'mis-graph-wrap' }, svg);
  var hint = h('div', { class: 'muted small mis-scroll-hint' }, '↔ 옆으로 밀어서 전체를 볼 수 있어요.');
  // 화면이 좁아 그래프가 넘치면 안내를 보여 준다.
  setTimeout(function () { hint.style.display = wrap.scrollWidth > wrap.clientWidth + 4 ? '' : 'none'; }, 60);
  return h('div', null, wrap, hint);
}

/* ===================== 로그인·회원가입 ===================== */
/* 웹을 열면 바로 로그인 창. 아이디가 없는 학생만 [회원가입]. */

function renderLogin(mode) {
  mode = mode || 'student';
  // 하얀 카드는 크기 고정: 위(로고) · 학생/교사 · 입력칸 · 아래(로그인/회원가입 버튼 자리 고정)
  var card = h('div', { class: 'card login-card mode-' + mode });
  card.appendChild(h('div', { class: 'login-brand' }, brandSchool('lg')));
  if (BOOT.ready === false) card.appendChild(h('div', { class: 'notice warn' }, '아직 초기 설정이 되지 않았어요. 선생님께 알려 주세요.'));
  if (mode === 'signup') {
    card.appendChild(h('div', { class: 'tabs login-tabs' }, h('button', { class: 'tab active', type: 'button' }, '회원가입')));
  } else {
    card.appendChild(h('div', { class: 'tabs login-tabs' },
      h('button', { class: 'tab' + (mode === 'student' ? ' active' : ''), type: 'button', onclick: function () { renderLogin('student'); } }, '학생'),
      h('button', { class: 'tab' + (mode === 'teacher' ? ' active' : ''), type: 'button', onclick: function () { renderLogin('teacher'); } }, '교사')));
  }
  var fields = h('div', { class: 'login-fields' });
  var actions = h('div', { class: 'login-actions' });
  var msg = h('div', { class: 'msg' });
  card.appendChild(fields);
  card.appendChild(actions);
  card.appendChild(msg);

  function signupRow(onClick) {
    actions.appendChild(h('div', { class: 'muted small login-ask' }, '아이디가 없나요?'));
    actions.appendChild(h('button', { class: 'btn block login-signup', type: 'button', onclick: onClick }, '회원가입'));
  }

  if (mode === 'teacher') {
    var tid = h('input', { class: 'input', type: 'text', autocomplete: 'username', autocapitalize: 'off' });
    var tpw = h('input', { class: 'input', type: 'password', autocomplete: 'current-password' });
    var tbtn = h('button', { class: 'btn primary block', type: 'button' }, '로그인');
    var goT = function () {
      msg.className = 'msg'; msg.textContent = '';
      tbtn.disabled = true;
      api('api_teacherLogin', { loginId: tid.value, password: tpw.value }).then(afterLogin).catch(function (e) { msg.textContent = e.message; }).then(function () { tbtn.disabled = false; });
    };
    tbtn.onclick = goT;
    tpw.addEventListener('keydown', function (e) { if (e.key === 'Enter') goT(); });
    fields.appendChild(h('div', { class: 'field' }, h('label', null, '아이디'), tid));
    fields.appendChild(h('div', { class: 'field' }, h('label', null, '비밀번호'), tpw));
    actions.appendChild(tbtn);
    // 교사 계정은 스스로 만들 수 없다: 버튼 자리는 같게 두고 안내만 한다.
    signupRow(function () {
      openModal({ title: '교사 회원가입', body: h('div', { style: { lineHeight: '1.7' } }, '교사 계정은 관리자가 만들어 드려요.', h('br'), '학교 담당자(관리자)에게 아이디 발급을 요청해 주세요. 받은 아이디로 로그인한 뒤 ⚙ 설정에서 비밀번호를 바꿀 수 있어요.') });
    });
    setApp(loginShell(card, mode));
    return;
  }

  var sel = h('select', { class: 'input' });
  (BOOT.classes || ['1', '2', '3', '4', '5']).forEach(function (c) { sel.appendChild(h('option', { value: c }, classLabel(c))); });
  var num = h('input', { class: 'input', type: 'number', inputmode: 'numeric', min: '1', max: '60', value: '1' });
  var name = h('input', { class: 'input', type: 'text', autocomplete: 'name' });

/* 문제 상태: 푸는 중 / 풀이 완료(완료·선생님 확인 중·못 풂) / 아직 안 푼 문제 */
function itemGroup_(it) {
  if (it.status === '완료' || it.status === '보류' || it.status === '못 풂') return 'done';
  if (it.status === '진행중') return 'doing';
  return 'todo';
}

function statusBadge(it) {
  var g = itemGroup_(it), b = [];
  if (g === 'doing') b.push(h('span', { class: 'badge doing' }, '푸는 중'));
  else if (g === 'done') b.push(h('span', { class: 'badge done' }, '풀이 완료'));
  if (it.teacherAnswered) b.push(h('span', { class: 'badge note' }, '선생님 답변'));
  return b.length ? h('div', { class: 'item-badges' }, b) : null;
}

/* 홈 화면 인사: 들어올 때마다 차례로 바꿔 보여 준다(이 기기에 순서를 기억) */
var GREETINGS = ['오늘도 한 문제씩 풀어 봐요', '틀려도 괜찮아요, 어디서 헷갈렸는지 함께 찾아봐요', '천천히 끝까지 생각하면 꼭 풀 수 있어요'];
var greetIdx = -1;
function nextGreeting_() {
  var i = greetIdx;
  try { i = parseInt(localStorage.getItem('mdx_greet') || '-1', 10); } catch (e) { /* 무시 */ }
  i = ((isNaN(i) ? -1 : i) + 1) % GREETINGS.length;
  greetIdx = i;
  try { localStorage.setItem('mdx_greet', String(i)); } catch (e) { /* 무시 */ }
  return GREETINGS[i];
}

function itemCard_(it) {
  var g = itemGroup_(it);
  return h('div', { class: 'item-card ' + g, onclick: function () { openWorkspace(it.assignmentId); } },
